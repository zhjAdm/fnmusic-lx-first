name: Build fnOS FPK

# Packaging is explicitly requested; pushes never create packages or releases.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.lock
          python -m pip install -e '.[test]'
      - name: Prepare public LX test runtime
        run: |
          python -m scripts.runtime prepare
          python -m scripts.runtime native
      - name: Test and lint
        run: |
          python -m pytest -q
          python -m ruff check fnmusic scripts tests
          node --check fnmusic/static/admin.js
      - name: Download and verify public build dependencies
        run: python -m scripts.prepare_fpk --arch both
      - name: Build x86 and ARM64 packages
        run: python -m scripts.build_fpk --arch both --fnpack work/fpk/cache/fnpack-1.2.3-linux-amd64
      - name: Verify both packages
        run: |
          python -m scripts.verify_fpk dist/*.fpk
          work/fpk/stage-x86/app/runtime/node/bin/node --version
          PYTHONPATH=work/fpk/stage-x86/app/site:work/fpk/stage-x86/app/code work/fpk/stage-x86/app/runtime/python/bin/python3 -c 'import fnmusic.app, fnmusic.manager, mutagen'
      - name: Upload installation packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fnmusic-fpk-${{ github.run_number }}
          path: |
            dist/*.fpk
            dist/*.fpk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
