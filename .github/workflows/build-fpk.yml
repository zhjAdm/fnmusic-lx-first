name: Build fnOS FPK

# Packaging/publication is explicitly requested; pushes never create packages or releases.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: '构建成功后发布到 Releases（版本号必须尚未发布）'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: fpk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.lock
          python -m pip install -e '.[test]'
      - name: Prepare public LX test runtime
        run: |
          python -m scripts.runtime prepare
          python -m scripts.runtime native
      - name: Test and lint
        run: |
          python -m pytest -q
          python -m ruff check fnmusic scripts tests
          node --check fnmusic/static/admin.js
      - name: Download and verify public build dependencies
        run: python -m scripts.prepare_fpk --arch both
      - name: Build x86 and ARM64 packages
        run: python -m scripts.build_fpk --arch both --fnpack work/fpk/cache/fnpack-1.2.3-linux-amd64
      - name: Verify both packages
        run: |
          python -m scripts.verify_fpk dist/*.fpk
          work/fpk/stage-x86/app/runtime/node/bin/node --version
          PYTHONPATH=work/fpk/stage-x86/app/site:work/fpk/stage-x86/app/code work/fpk/stage-x86/app/runtime/python/bin/python3 -c 'import fnmusic.app, fnmusic.manager, mutagen'
      - name: Upload installation packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fnmusic-fpk-${{ github.run_number }}
          path: |
            dist/*.fpk
            dist/*.fpk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          archive: true

  release:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fnmusic-fpk-${{ github.run_number }}
          path: dist
      - name: Publish a new version without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'from scripts.build_fpk import VERSION; import re; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", VERSION); print(VERSION)')
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists. Bump the source version or run with publish disabled."
            exit 1
          fi
          python3 -m scripts.verify_fpk dist/*.fpk
          cat > release-notes.md <<'NOTES'
          在飞牛应用中心手动安装/升级：Intel/AMD选择x86，ARM64选择arm；无需卸载。
          配套SHA256文件用于校验。管理页支持检查新版本并下载、校验匹配架构的安装包，仍需到应用中心手动安装。
          这是开发版；真实音源播放失败、官方HLS超时等问题请结合运行日志继续确认。软件包不含付费音源或密钥。
          NOTES
          printf '\n来源构建：%s/%s/actions/runs/%s\n源码提交：%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" >> release-notes.md
          gh release create "$tag" dist/*.fpk dist/*.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "fnMusic LX 扩展 $tag" --notes-file release-notes.md --draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
